<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weiyel O‘zbekiston</title>
<meta name="description" content="STANDART VA METROLOGIYA MCHJ — Weiyel’ning O‘zbekistondagi yagona rasmiy dileri. 12 900+ sertifikatlangan standart namunalar (CRM). Официальный дилер Weiyel в Узбекистане: стандартные образцы для лабораторий.">
<meta name="keywords" content="standart namuna, CRM, Weiyel, reference material, стандартные образцы, ГСО, лаборатория, Toshkent, Узбекистан">
<meta name="theme-color" content="#0b1626">
<meta property="og:type" content="website">
<meta property="og:title" content="Weiyel O‘zbekiston — rasmiy diler">
<meta property="og:description" content="12 900+ sertifikatlangan standart namunalar. STANDART VA METROLOGIYA MCHJ, Toshkent.">
<meta property="og:locale" content="uz_UZ">
<meta property="og:locale:alternate" content="ru_RU">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a6cff'/%3E%3Cstop offset='1' stop-color='%2300b4a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 6h8M13.5 6v7L8 23a2.5 2.5 0 0 0 2.2 3.7h11.6A2.5 2.5 0 0 0 24 23l-5.5-10V6' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6778; --line:#e3e8ef;
  --brand:#0a6cff; --brand-2:#00b4a6; --brand-soft:#e8f1ff; --dark:#0b1626;
  --radius:18px; --shadow:0 10px 30px rgba(15,27,45,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.container{width:min(1180px,100% - 32px);margin-inline:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;border:0;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;font-size:15px}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 24px rgba(10,108,255,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(10,108,255,.45)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}

/* Header */
header{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
header.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,.06)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:#fff;transition:color .3s}
header.scrolled .logo{color:var(--ink)}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center}
.menu{display:flex;gap:28px;list-style:none}
.menu a{color:rgba(255,255,255,.88);font-weight:600;font-size:15px;position:relative;transition:color .3s}
header.scrolled .menu a{color:var(--ink)}
.menu a::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--brand-2);transition:width .3s}
.menu a:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:12px}
.lang{display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:4px;border:1px solid rgba(255,255,255,.3)}
header.scrolled .lang{background:var(--brand-soft);border-color:transparent}
.lang button{border:0;background:transparent;color:#fff;font:700 13px Manrope;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.25s}
header.scrolled .lang button{color:var(--ink)}
.lang button.active{background:#fff;color:var(--brand)!important;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.burger{display:none;background:none;border:0;cursor:pointer;color:#fff}
header.scrolled .burger{color:var(--ink)}

/* Hero */
.hero{position:relative;display:flex;align-items:center;color:#fff;background:radial-gradient(1200px 600px at 80% 20%,#1b4fd8 0%,transparent 60%),radial-gradient(900px 500px at 10% 90%,#008f86 0%,transparent 55%),var(--dark);overflow:hidden;padding:140px 0 110px}
#molecules{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:13px;font-weight:600;margin-bottom:22px}
.dot{width:8px;height:8px;border-radius:50%;background:#35e0b4;box-shadow:0 0 0 0 rgba(53,224,180,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(53,224,180,0)}100%{box-shadow:0 0 0 0 rgba(53,224,180,0)}}
.hero h1{font-size:clamp(34px,5.2vw,62px);line-height:1.08;font-weight:800;letter-spacing:-.02em;margin-bottom:20px}
.grad{background:linear-gradient(90deg,#5fb2ff,#35e0b4,#5fb2ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
.hero p.lead{font-size:18px;color:rgba(255,255,255,.78);max-width:560px;margin-bottom:34px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:24px;padding:28px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.flask{width:100%;max-width:260px;margin:0 auto 18px}
.liquid{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-4px)}}
.bubble{animation:rise 3s ease-in infinite;opacity:0}
.bubble:nth-child(2){animation-delay:1s}.bubble:nth-child(3){animation-delay:2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.hero-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:rgba(255,255,255,.08);border-radius:14px;padding:14px;text-align:center}
.mini b{display:block;font-size:24px}
.mini span{font-size:12px;color:rgba(255,255,255,.7)}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:26px;height:42px;border:2px solid rgba(255,255,255,.4);border-radius:14px}
.scroll-hint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:scrolldot 1.8s infinite}
@keyframes scrolldot{to{transform:translateY(14px);opacity:0}}

/* Certs marquee */
.marquee{background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden;padding:22px 0}
.track{display:flex;gap:60px;width:max-content;animation:marquee 28s linear infinite}
.track span{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:16px}
.track span svg{color:var(--brand)}
@keyframes marquee{to{transform:translateX(-50%)}}

/* Sections */
section{padding:96px 0}
.head{text-align:center;max-width:680px;margin:0 auto 56px}
.eyebrow{display:inline-block;color:var(--brand);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.head h2{font-size:clamp(28px,3.6vw,42px);line-height:1.15;letter-spacing:-.02em;margin-bottom:14px}
.head p{color:var(--muted);font-size:17px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:-60px;position:relative;z-index:3}
.stat{background:var(--surface);border-radius:var(--radius);padding:28px 22px;box-shadow:var(--shadow);text-align:center;border:1px solid var(--line)}
.stat b{font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat p{color:var(--muted);font-weight:600;font-size:14px}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s,border-color .35s;cursor:pointer}
.cat::before{content:"";position:absolute;inset:auto -40% -60% auto;width:180px;height:180px;border-radius:50%;background:var(--c,var(--brand));opacity:.08;transition:transform .5s}
.cat:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(15,27,45,.12);border-color:transparent}
.cat:hover::before{transform:scale(2.4)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,white);color:var(--c);margin-bottom:18px;transition:transform .4s}
.cat:hover .ico{transform:rotate(-8deg) scale(1.08)}
.cat h3{font-size:18px;margin-bottom:8px;position:relative}
.cat p{font-size:14px;color:var(--muted);position:relative}
.cat .more{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-weight:700;font-size:14px;color:var(--c);position:relative}
.cat .more svg{transition:transform .3s}
.cat:hover .more svg{transform:translateX(5px)}

/* Bio QC */
.bio{background:var(--dark);color:#fff;border-radius:32px;padding:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;position:relative;overflow:hidden}
.bio::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#00b4a655,transparent 70%);right:-120px;top:-120px}
.bio h2{font-size:clamp(26px,3.2vw,38px);line-height:1.15;margin-bottom:16px}
.bio p{color:rgba(255,255,255,.72);margin-bottom:26px}
.bio-list{display:grid;gap:12px;position:relative;z-index:1}
.bio-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:background .3s,transform .3s}
.bio-item:hover{background:rgba(255,255,255,.12);transform:translateX(6px)}
.bio-item i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));font-style:normal;font-weight:800;font-size:14px;flex:none}
.dna{width:100%;max-width:120px;margin-bottom:18px}
.dna circle{animation:dna 2.4s ease-in-out infinite}
@keyframes dna{50%{transform:translateX(var(--dx))}}

/* Why us */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.why-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 24px;text-align:center;transition:transform .35s,box-shadow .35s}
.why-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.why-ico{width:70px;height:70px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);position:relative}
.why-ico::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed #b9d3ff;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.why-card h3{font-size:18px;margin-bottom:8px}
.why-card p{color:var(--muted);font-size:14px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative}
.steps::before{content:"";position:absolute;top:32px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,var(--brand) 0 10px,transparent 10px 18px);opacity:.35}
.step{text-align:center;position:relative}
.step-n{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:var(--surface);border:2px solid var(--brand);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--brand);transition:background .3s,color .3s}
.step:hover .step-n{background:var(--brand);color:#fff}
.step h3{font-size:17px;margin-bottom:6px}
.step p{font-size:14px;color:var(--muted)}

/* About */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about-visual{position:relative;aspect-ratio:1/1;max-width:460px;width:100%;margin:0 auto}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.ring.r2{inset:14%;border-color:#cfe0ff}.ring.r3{inset:28%;background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;display:grid;place-items:center;color:#fff;text-align:center}
.ring.r3 b{font-size:54px;line-height:1;display:block}
.ring.r3 span{font-size:14px;opacity:.9}
.orbit{position:absolute;inset:0;animation:spin 20s linear infinite}
.orbit.o2{inset:14%;animation-duration:14s;animation-direction:reverse}
.planet{position:absolute;top:-16px;left:50%;margin-left:-60px;width:120px;padding:8px 10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;font-weight:700;text-align:center;animation:spin 20s linear infinite reverse}
.o2 .planet{animation-duration:14s;animation-direction:normal;top:auto;bottom:-16px}
.about h2{font-size:clamp(28px,3.4vw,40px);line-height:1.15;margin-bottom:18px}
.about p{color:var(--muted);margin-bottom:16px}
.checks{list-style:none;display:grid;gap:10px;margin:22px 0 30px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.checks svg{flex:none;color:var(--brand-2);margin-top:3px}

/* Product catalog */
.pc-bar{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px;margin-bottom:14px}
.pc-search{position:relative}
.pc-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.pc-search input{padding-left:46px}
.pc-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:14px;font-weight:600}
.pc-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.pc-reset{background:none;border:0;color:var(--brand);font:700 14px Manrope;cursor:pointer}
.pc-table{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pc-row{display:grid;grid-template-columns:52px 150px 1fr 130px 110px 130px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);font-size:14px}
.pc-row:first-child{border-top:0}
.pc-row.pc-head{background:var(--bg);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pc-row:not(.pc-head){cursor:pointer}
.pc-row:not(.pc-head):hover{background:#f8fbff}
.pc-row:not(.pc-head):hover .pc-name>b{color:var(--brand)}
.pc-th{width:52px;height:52px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#9fb3cf}
.pc-th img{width:100%;height:100%;object-fit:contain;background:#fff}
.pc-acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pc-more-btn{border:0;background:none;color:var(--muted);font:700 12px Manrope;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pc-more-btn:hover{color:var(--brand)}
.pc-name>b{font-weight:700;transition:color .2s}
.pc-no{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--brand);font-size:13px;word-break:break-all}
.pc-name{font-weight:600;overflow-wrap:anywhere}
.pc-name small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.pc-price{display:block;font-style:normal;font-weight:800;color:var(--ink);margin-top:2px}
.pc-cas,.pc-spec{color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pc-btn{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:8px 14px;font:700 13px Manrope;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.pc-btn:hover,.pc-btn.added{background:var(--brand);color:#fff}
.pc-empty{padding:40px 18px;text-align:center;color:var(--muted)}
.pc-more{display:flex;justify-content:center;margin-top:18px}
.pc-more .btn{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.pc-more .btn:hover{border-color:var(--brand);color:var(--brand)}
.pc-loading{padding:40px;text-align:center;color:var(--muted)}
.lbl-mob{display:none}
@media (max-width:820px){
  .pc-bar{grid-template-columns:1fr 1fr}.pc-search{grid-column:1/-1}
  .pc-row.pc-head{display:none}
  .pc-row{grid-template-columns:52px 1fr;gap:4px 12px;padding:14px 16px}
  .pc-th{grid-row:1/span 4;align-self:start}
  .pc-no,.pc-name,.pc-cas,.pc-spec{grid-column:2}.pc-cas,.pc-spec{font-size:13px}
  .pc-acts{grid-column:2;flex-direction:row;align-items:center;gap:14px;margin-top:6px}
  .lbl-mob{display:inline;font-weight:700}
}

/* Catalog as its own page */
body.catalog-open > :not(header):not(#products):not(#contact):not(footer):not(.wa):not(.pc-cart):not(.pd):not(script){display:none!important}
body.catalog-open #products{padding-top:calc(110px + env(safe-area-inset-top,0px))!important;min-height:70vh}
body.catalog-open #contact{padding-top:40px!important}
#products{display:none}
body.catalog-open #products{display:block}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.pc-back{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--brand);padding:10px 16px 10px 12px;border-radius:999px;background:var(--brand-soft);transition:transform .2s}
.pc-back:hover{transform:translateX(-3px)}
.pc-crumb{color:var(--muted);font-size:14px;font-weight:600}
#products .head{text-align:left;margin:0 0 28px;max-width:none}
.pc-cart{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:55;display:flex;align-items:center;gap:10px;padding:14px 22px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 15px Manrope;cursor:pointer;box-shadow:0 14px 34px rgba(15,27,45,.3);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.pc-cart.show{transform:translate(-50%,0)}
.pc-cart b{background:var(--brand-2);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 7px}

/* Product detail dialog */
.pd{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(11,22,38,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.pd.open{opacity:1;pointer-events:auto}
.pd-box{background:var(--surface);border-radius:24px;width:min(980px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(18px) scale(.98);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);position:relative}
.pd.open .pd-box{transform:none}
.pd-x{position:sticky;top:12px;float:right;margin:12px 12px 0 0;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:2}
.pd-x:hover{background:var(--brand-soft);color:var(--brand)}
.pd-grid{display:grid;grid-template-columns:340px 1fr;gap:32px;padding:32px}
.pd-media{display:grid;gap:12px;align-content:start}
.pd-img{aspect-ratio:1/1;max-width:100%;border-radius:18px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.pd-img img{width:100%;height:100%;object-fit:contain}
.pd-ph{display:grid;place-items:center;gap:10px;color:#9fb3cf;text-align:center;padding:20px;font-weight:700;font-size:13px}
.pd-mol{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;display:grid;gap:4px;justify-items:center}
.pd-mol img{max-width:100%;max-height:150px;object-fit:contain}
.pd-mol small{color:var(--muted);font-weight:700;font-size:12px}
.pd-cat{color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pd h3{font-size:clamp(22px,2.6vw,30px);line-height:1.2;margin:6px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.pd-ids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pd-ids span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.pd-ids .pd-price{background:#e6fbf5;border-color:#b5ecd9;color:#067a5f;font-weight:800}
.pd-ids b{color:var(--muted);font-weight:700;margin-right:4px}
.pd h4{font-size:15px;margin:22px 0 10px}
.pd-spec{width:100%;border-collapse:collapse;font-size:14px}
.pd-spec th,.pd-spec td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.pd-spec th{width:38%;color:var(--muted);font-weight:700;background:var(--bg)}
.pd-spec td{overflow-wrap:anywhere}
.pd-packs{display:flex;flex-wrap:wrap;gap:8px}
.pd-packs span{border:1px solid #cfe0ff;background:var(--brand-soft);color:#0a4fc2;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.pd-tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.pd-tw table{width:100%;min-width:480px;border-collapse:collapse;font-size:13px}
.pd-tw th{background:var(--bg);color:var(--muted);text-align:left;padding:10px 12px;font-weight:800;font-size:12px}
.pd-tw td{padding:10px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pd-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.pd-note{color:var(--muted);font-size:14px;background:var(--bg);border-radius:14px;padding:16px}
.pd-load{display:grid;gap:10px}
.pd-load i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),#f3f6fa,var(--line));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
body.pd-lock{overflow:hidden}
@media (max-width:820px){.pd-grid{grid-template-columns:1fr;padding:22px;gap:20px}.pd-media{grid-template-columns:1fr 1fr}.pd-img{aspect-ratio:1/1}}

/* Dealer */
.dealer{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.dealer h2{font-size:clamp(28px,3.4vw,40px);line-height:1.15;margin-bottom:16px}
.dealer>div>p{color:var(--muted);margin-bottom:26px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.d-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .3s,box-shadow .3s}
.d-item:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.d-item .ico{width:44px;height:44px;border-radius:12px;margin-bottom:12px;--c:var(--brand)}
.d-item h3{font-size:15px;margin-bottom:4px}
.d-item p{font-size:13px;color:var(--muted)}
.cert-card{position:relative;background:var(--surface);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(15,27,45,.14);transform:rotate(2deg);transition:transform .5s}
.cert-card:hover{transform:rotate(0) scale(1.02)}
.cert-card img{width:100%;border-radius:14px;display:block}
.cert-ph{aspect-ratio:1/1.3;border-radius:14px;border:2px solid #d6e4ff;background:linear-gradient(160deg,#fff,#eef4ff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px;position:relative;overflow:hidden}
.cert-ph::before{content:"";position:absolute;inset:12px;border:1px dashed #b9d3ff;border-radius:10px}
.cert-ph .seal{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;animation:spin 16s linear infinite}
.cert-ph b{font-size:20px;letter-spacing:.04em}
.cert-ph small{color:var(--muted);font-weight:600}
.ribbon{position:absolute;top:-14px;left:-14px;background:linear-gradient(135deg,#ffb020,#ff7a00);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 20px rgba(255,122,0,.35);z-index:2}
.flag{display:inline-block;width:22px;height:15px;border-radius:3px;background:linear-gradient(#0099b5 0 33%,#fff 33% 67%,#1eb53a 67%);box-shadow:0 0 0 1px rgba(0,0,0,.1);vertical-align:-2px}
@media (max-width:1000px){.dealer{grid-template-columns:1fr}.cert-card{max-width:380px;margin:0 auto}}
@media (max-width:560px){.d-grid{grid-template-columns:1fr}}

/* FAQ */
.faq{max-width:820px;margin:0 auto;display:grid;gap:12px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 22px;transition:box-shadow .3s}
.faq details[open]{box-shadow:var(--shadow)}
.faq summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--brand);transition:transform .3s;line-height:1}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding-bottom:18px}

/* Contact */
.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px}
.c-info{background:linear-gradient(145deg,var(--brand),#0048b8 60%,var(--brand-2));color:#fff;border-radius:24px;padding:40px}
.c-info h3{font-size:26px;margin-bottom:10px}
.c-info>p{opacity:.85;margin-bottom:28px}
.c-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.18)}
.c-row i{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.c-row small{display:block;opacity:.75;font-size:12px}
.c-row b{font-size:16px;word-break:break-all}
form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px;display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-size:13px;font-weight:700;color:var(--muted);display:grid;gap:6px}
input,select,textarea{font:500 15px Manrope;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:border-color .25s,box-shadow .25s;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
textarea{min-height:120px;resize:vertical}
.ok{display:none;padding:14px;border-radius:12px;background:#e6fbf5;color:#067a5f;font-weight:700}

/* Footer */
footer{background:var(--dark);color:rgba(255,255,255,.7);padding:64px 0 28px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:40px}
footer h4{color:#fff;margin-bottom:14px}
footer ul{list-style:none;display:grid;gap:8px;font-size:14px;overflow-wrap:anywhere}
footer a:hover{color:#fff}
.f-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.socials{display:flex;gap:10px;margin-top:18px}
.socials a{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;transition:background .3s,transform .3s}
.socials a:hover{background:var(--brand);transform:translateY(-3px)}

/* Floating WhatsApp */
.wa{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(37,211,102,.45);animation:bounce 3s infinite}
@keyframes bounce{0%,85%,100%{transform:translateY(0)}90%{transform:translateY(-8px)}}

/* Reveal */
.reveal.in{animation:rise-in .8s ease both}
@keyframes rise-in{from{opacity:.35;transform:translateY(24px)}to{opacity:1;transform:none}}
.d1.in{animation-delay:.08s}.d2.in{animation-delay:.16s}.d3.in{animation-delay:.24s}

/* Responsive */
@media (max-width:1000px){
  .cats,.why{grid-template-columns:repeat(2,1fr)}
  .hero-grid,.bio,.about,.contact{grid-template-columns:1fr}
  .hero-card{max-width:420px}
  .f-grid{grid-template-columns:1fr 1fr}
  .bio{padding:40px 28px}
}
@media (max-width:820px){
  .menu{position:fixed;top:74px;left:0;right:0;flex-direction:column;gap:0;background:#fff;padding:10px 16px 20px;box-shadow:0 20px 30px rgba(0,0,0,.08);transform:translateY(-130%);transition:transform .35s}
  .menu.open{transform:none}
  .menu a{color:var(--ink)!important;display:block;padding:14px 4px;border-bottom:1px solid var(--line)}
  .burger{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr 1fr;row-gap:36px}
  .steps::before{display:none}
}
@media (max-width:560px){
  section{padding:72px 0}
  .cats,.why{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  form,.c-info{padding:26px}
  .f-grid{grid-template-columns:1fr}
  .stat b{font-size:32px}
  .lang button{padding:6px 10px}
  .logo span.txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- HERO -->

const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.12});
function observe(){ document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el)); }

const cio = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  const el=e.target, end=+el.dataset.count, t0=performance.now(), dur=1800;
  const step=now=>{ const p=Math.min((now-t0)/dur,1), v=Math.round(end*(1-Math.pow(1-p,3))); el.textContent=v.toLocaleString('ru-RU'); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step); cio.unobserve(el);
}),{threshold:.5});

/* ---------- MOLECULE CANVAS ---------- */
(function(){
  const c=document.getElementById('molecules'), x=c.getContext('2d'); let W,H,P=[];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=c.width=c.offsetWidth*devicePixelRatio; H=c.height=c.offsetHeight*devicePixelRatio;
    const n=Math.min(70,Math.floor(c.offsetWidth/18)); P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4*devicePixelRatio,vy:(Math.random()-.5)*.4*devicePixelRatio,r:(Math.random()*2+1.2)*devicePixelRatio})); }
  function draw(){
    x.clearRect(0,0,W,H); const L=130*devicePixelRatio;
    for(let i=0;i<P.length;i++){ const a=P[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy; if(a.x<0||a.x>W)a.vx*=-1; if(a.y<0||a.y>H)a.vy*=-1;}
      for(let j=i+1;j<P.length;j++){ const b=P[j], d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<L){ x.strokeStyle=`rgba(120,190,255,${1-d/L})`; x.lineWidth=devicePixelRatio*.8; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } }
      x.fillStyle='#8fd3ff'; x.beginPath(); x.arc(a.x,a.y,a.r,0,7); x.fill();
    }
    if(!reduce) requestAnimationFrame(draw);
  }
  addEventListener('resize',size); size(); draw();
})();

const FLASK='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7 15h10"/></svg>';
function pcThumb(r){ const u=IMG(r[5])||(/^\d+-\d+-\d$/.test(r[2])?MOL(r[2]):''); return u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createRange().createContextualFragment(FLASK))">`:FLASK; }
const sub=v=>esc(v).replace(/&lt;(\/?)sub&gt;/g,'<$1sub>');
const PD={no:null,chunks:{}};
/* translate common spec values; anything unknown stays as on weiyel.com */
const TV={
 uz:{v:{"Liquid State":"Suyuq","Solid State":"Qattiq","Solid-Liquid Coexistence":"Qattiq-suyuq","Pure":"Toza modda","Water":"Suv","Methanol":"Metanol","Acetonitrile":"Atsetonitril","Ethanol":"Etanol","Acetone":"Aseton","Hexane":"Geksan","n-Hexane":"n-Geksan","Toluene":"Toluol","Soil":"Tuproq","Filter Paper":"Filtr qog‘oz","Activated carbon":"Faollashtirilgan ko‘mir","Petroleum":"Neft","Fertilizer":"O‘g‘it","Standard":"Standart","Brown ampoule":"Jigarrang ampula","Plastic bottle":"Plastik shisha","Brown glass bottle":"Jigarrang shisha idish","Ampoule bottle":"Ampula","Brown vial":"Jigarrang flakon","Plastic box":"Plastik quti","White plastic bottle":"Oq plastik idish","Activated carbon tube":"Ko‘mirli naycha","box":"Quti","Box":"Quti","Vial":"Flakon","Brown plastic bottle":"Jigarrang plastik idish","Aluminum foil bag":"Alyumin folga paket","Glass bottle":"Shisha idish"},
     m:"oy",temp:[["at 2-8 ℃","2–8 ℃ haroratda"],["Room temperature","Xona haroratida"],["in cool","Salqin joyda"],["at -20 ℃","-20 ℃ haroratda"],["at -18 ℃","-18 ℃ haroratda"]],
     std:"germetik va yorug‘likdan himoyalangan joyda saqlang. Ishlatishdan oldin (20±3) ℃ gacha keltirib, yaxshilab chayqating. Ochilgandan so‘ng darhol ishlating, ifloslanishdan saqlang."},
 ru:{v:{"Liquid State":"Жидкость","Solid State":"Твёрдое вещество","Solid-Liquid Coexistence":"Твёрдое/жидкое","Pure":"Чистое вещество","Water":"Вода","Methanol":"Метанол","Acetonitrile":"Ацетонитрил","Ethanol":"Этанол","Acetone":"Ацетон","Hexane":"Гексан","n-Hexane":"н-Гексан","Toluene":"Толуол","Soil":"Почва","Filter Paper":"Фильтровальная бумага","Activated carbon":"Активированный уголь","Petroleum":"Нефть","Fertilizer":"Удобрение","Standard":"Стандарт","Brown ampoule":"Ампула тёмного стекла","Plastic bottle":"Пластиковый флакон","Brown glass bottle":"Флакон тёмного стекла","Ampoule bottle":"Ампула","Brown vial":"Виала тёмного стекла","Plastic box":"Пластиковая коробка","White plastic bottle":"Белый пластиковый флакон","Activated carbon tube":"Угольная трубка","box":"Коробка","Box":"Коробка","Vial":"Виала","Brown plastic bottle":"Тёмный пластиковый флакон","Aluminum foil bag":"Пакет из алюминиевой фольги","Glass bottle":"Стеклянный флакон"},
     m:"мес.",temp:[["at 2-8 ℃","При 2–8 ℃"],["Room temperature","При комнатной температуре"],["in cool","В прохладном месте"],["at -20 ℃","При −20 ℃"],["at -18 ℃","При −18 ℃"]],
     std:"хранить герметично, в защищённом от света месте. Перед использованием выдержать до (20±3) ℃ и перемешать. После вскрытия использовать сразу, избегать загрязнения."}
};
const STDTXT="Store airtight and away from light place.";
function tv(k,v){
  const L=TV[lang];
  if(L.v[v]) return esc(L.v[v]);
  const mm=v.match(/^([\d.]+)\s*Months?$/i); if(mm) return mm[1]+' '+L.m;
  if(/^(Save|Storage) conditions$/.test(k) && v.includes(STDTXT)){
    const pre=v.split(STDTXT)[0].trim(), tp=L.temp.find(x=>x[0]===pre);
    if(tp) return esc(tp[1]+', '+L.std);
  }
  return sub(v);
}
window.WYD=(k,data)=>{ PD.chunks[k]=data; if(PD.no&&pdChunk(PD.no)===k) pdRender(); };
function pdRowIdx(no){ if(!WY.idx){ WY.idx={}; WY.rows.forEach((r,i)=>WY.idx[r[0]]=i); } return WY.idx[no]; }
function pdChunk(no){ return Math.floor(pdRowIdx(no)/WY.cs); }
function pdLoad(k){
  if(PD.chunks[k]!==undefined||PD['l'+k]) return; PD['l'+k]=1;
  const sc=document.createElement('script'); sc.src='d/'+k+'.js';
  sc.onerror=()=>{ PD.chunks[k]=null; if(PD.no&&pdChunk(PD.no)===k) pdRender(); };
  document.head.appendChild(sc);
}
function pdOpen(no){
  PD.no=no; const k=pdChunk(no); pdLoad(k); pdRender();
  $('pd').classList.add('open'); document.body.classList.add('pd-lock'); PD.back=document.activeElement;
  setTimeout(()=>$('pdX')&&$('pdX').focus(),50);
}
function pdClose(){ $('pd').classList.remove('open'); document.body.classList.remove('pd-lock'); PD.no=null; if(PD.back&&PD.back.focus) PD.back.focus(); }
$('pd').addEventListener('click',e=>{ if(e.target.id==='pd'||e.target.closest('#pdX')) pdClose(); if(e.target.closest('#pdAdd')) pcToggle(PD.no); if(e.target.closest('#pdAsk')){ if(!PC.picked.has(PD.no)) pcToggle(PD.no); pdClose(); $('contact').scrollIntoView({behavior:'smooth'}); } });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&PD.no) pdClose(); });
function pdRender(){
  if(!PD.no) return;
  const t=T[lang], li=lang==='uz'?0:1, r=WY.rows[pdRowIdx(PD.no)], k=pdChunk(PD.no), ch=PD.chunks[k], d=(PD.over&&PD.over[r[0]])||(ch?ch[r[0]]:null), on=PC.picked.has(r[0]);
  const cas=r[2], casOk=/^\d+-\d+-\d$/.test(cas), photo=IMG(r[5])||(casOk?MOL(cas):''), showMol=casOk&&!!IMG(r[5]);
  const mainName=pcMainName(WY.subs[r[4]].split('_')[0]);
  let body;
  if(ch===undefined&&!(PD.over&&PD.over[r[0]])){ body='<div class="pd-load"><i style="width:60%"></i><i></i><i style="width:80%"></i><i style="width:70%"></i></div>'; }
  else if(!d||(!d.b&&!d.p&&!d.m)){ body=`<p class="pd-note">${t.pd_nodata}</p>`; }
  else {
    body='';
    const bb=(d.b||[]).filter(([kk,v])=>v&&v!=='/');
    if(bb.length) body+=`<h4>${t.pd_spec}</h4><table class="pd-spec"><tbody>${bb.map(([kk,v])=>`<tr><th>${esc(t.lbl[kk]||kk)}</th><td>${tv(kk,v)}</td></tr>`).join('')}</tbody></table>`;
    if(d.p) body+=`<h4>${t.pd_packs}</h4><div class="pd-packs">${d.p.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
    if(d.m) body+=`<h4>${t.pd_comp}</h4><div class="pd-tw"><table><thead><tr>${t.pd_comp_h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${d.m.map(row=>`<tr>${[0,1,2,3].map(i=>`<td>${sub(row[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  $('pdBox').innerHTML=`<button type="button" class="pd-x" id="pdX" aria-label="${t.pd_close}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="pd-grid">
    <div class="pd-media">
      <div class="pd-img">${photo?`<img referrerpolicy="no-referrer" src="${esc(photo)}" alt="${esc(r[1])}" onerror="this.parentNode.innerHTML='<div class=&quot;pd-ph&quot;>'+FLASK+'${esc(t.pd_noimg)}</div>'">`:`<div class="pd-ph">${FLASK}${t.pd_noimg}</div>`}</div>
      ${showMol?`<div class="pd-mol"><img referrerpolicy="no-referrer" src="${esc(MOL(cas))}" alt="" onerror="this.parentNode.remove()"><small>${t.pd_mol}</small></div>`:''}
    </div>
    <div>
      <div class="pd-cat">${esc(mainName)} · ${esc(WY.names[WY.subs[r[4]]][li])}</div>
      <h3 id="pdTitle">${esc(r[1])}</h3>
      <div class="pd-ids"><span><b>${t.pd_catno}</b>${esc(r[0])}</span>${cas?`<span><b>CAS</b>${esc(cas)}</span>`:''}${r[3]?`<span><b>${t.pc_h[3]}</b>${esc(r[3])}</span>`:''}${r[6]?`<span class="pd-price"><b>${t.pd_price}</b>${esc(r[6])}</span>`:''}</div>
      ${body}
      <div class="pd-acts"><button type="button" class="btn btn-primary" id="pdAsk">${t.pd_ask}</button><button type="button" class="pc-btn${on?' added':''}" id="pdAdd">${on?t.pc_added:t.pc_add}</button></div>
    </div>
  </div>`;
}

/* ---------- ADMIN PANEL MA'LUMOTLARI (Supabase) ---------- */
const SBO={settings:null,products:null};
function sbGet(path){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),6000);
  return fetch(SB.url+'/rest/v1/'+path,{headers:{apikey:SB.key,Authorization:'Bearer '+SB.key},signal:ctl.signal}).then(r=>r.ok?r.json():null).catch(()=>null).finally(()=>clearTimeout(tm));
}
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null) return; o=o[ks[i]]; } if(typeof o[ks[ks.length-1]]==='string') o[ks[ks.length-1]]=val; }
function applySettings(){
  const st=SBO.settings; if(!st) return;
  const m={}; st.forEach(x=>m[x.key]=x.value);
  if(m.dealer) Object.keys(m.dealer).forEach(k=>{ if(m.dealer[k]!==undefined&&m.dealer[k]!==null) DEALER[k]=m.dealer[k]; });
  if(m.texts) ['uz','ru'].forEach(L=>{ const o=m.texts[L]||{}; Object.keys(o).forEach(p=>{ if(typeof o[p]==='string'&&o[p].trim()) setPath(T[L],p,o[p]); }); });
  if(m.cert&&m.cert.url){ const ph=$('certPh'); let im=$('certImg'); if(!im){ im=document.createElement('img'); im.id='certImg'; im.alt=''; ph.parentNode.insertBefore(im,ph); } im.src=m.cert.url; ph.hidden=true; }
  fillDealer(); render();
}
function applyProducts(){
  if(!SBO.products||!pcReady()||WY.applied) return; WY.applied=1;
  PD.over={};
  SBO.products.forEach(({catno,data:d})=>{
    if(!d) return;
    let i=pdRowIdx(catno), r=i===undefined?null:WY.rows[i];
    let si=d.sub?WY.subs.indexOf(d.sub):-1;
    if(d.sub&&si<0&&WY.names[d.sub]){ WY.subs.push(d.sub); si=WY.subs.length-1; }
    if(!r){ if(d.hidden||!d.name||si<0) return; r=[catno,d.name,d.cas||'',d.spec||'',si,d.img||'',d.price||'']; WY.rows.unshift(r); WY.idx=null; }
    else {
      if(d.name) r[1]=d.name; if(d.cas!==undefined) r[2]=d.cas; if(d.spec!==undefined) r[3]=d.spec;
      if(si>=0) r[4]=si; if(d.img) r[5]=d.img; r[6]=d.price||''; r.h=!!d.hidden; r.s=null;
    }
    if(d.details) PD.over[catno]=d.details;
  });
  pcLang();
}
sbGet('sm_settings?select=key,value').then(x=>{ SBO.settings=x; applySettings(); });
sbGet('sm_products?select=catno,data').then(x=>{ SBO.products=x||[]; applyProducts(); });
window.addEventListener('wy-loaded',applyProducts);

render();
route();
</script>
